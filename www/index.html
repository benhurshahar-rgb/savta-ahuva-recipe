<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#E9E1D2">
<title>ספר המתכונים של סבתא אהובה</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" aria-hidden="true" style="position:absolute"><defs>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="5"/><feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.30  0 0 0 0 0.16  0 0 0 0.10 0"/></filter>
<filter id="cork"><feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="3" seed="9"/><feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.22  0 0 0 0 0.10  0 0 0 0.55 -0.12"/></filter>
<filter id="stir" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence id="stirTurb" type="turbulence" baseFrequency="0.012 0.02" numOctaves="2" seed="7" result="n"/><feDisplacementMap id="stirDisp" in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G"/></filter>
</defs></svg>
<div id="stage"></div>
<div id="layer"></div>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="vendor/firebase.js"></script>
<script src="vendor/mammoth.browser.min.js"></script>
<script src="ingredients.js"></script>
<script src="app.js"></script>
</body>
</html>
